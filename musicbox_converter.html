<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDI 转八音盒乐谱工具</title>
<script src="https://cdn.jsdelivr.net/npm/midi-parser-js@3.0.1/build/midi-parser.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5efe6; color: #3d2b1a; line-height: 1.6;
}
.container { max-width: 860px; margin: 0 auto; padding: 16px; }

/* Header */
header {
    text-align: center; padding: 24px 0 16px;
    border-bottom: 2px solid #d4c5a9; margin-bottom: 20px;
}
header h1 { font-size: 22px; color: #5c3d2e; }
header h1 span { font-size: 26px; }
header p { font-size: 13px; color: #8a7a6a; margin-top: 4px; }

/* Card */
.card {
    background: #fff; border-radius: 12px; padding: 20px;
    margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.card-title {
    font-size: 15px; font-weight: 600; color: #5c3d2e;
    margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
}

/* Upload */
.upload-area {
    border: 2px dashed #d4c5a9; border-radius: 10px;
    padding: 32px 16px; text-align: center; cursor: pointer;
    transition: all 0.2s; position: relative;
}
.upload-area:hover, .upload-area.dragover {
    border-color: #c4956a; background: #fdf8f0;
}
.upload-area .icon { font-size: 36px; margin-bottom: 8px; }
.upload-area .text { font-size: 14px; color: #8a7a6a; }
.upload-area .text strong { color: #5c3d2e; }
.upload-area input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
}
.file-info {
    display: none; margin-top: 12px; padding: 10px 14px;
    background: #f5efe6; border-radius: 8px; font-size: 13px;
}

/* Buttons */
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
.btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 10px 20px; border: none; border-radius: 8px;
    font-size: 14px; cursor: pointer; transition: all 0.15s;
    font-family: inherit; font-weight: 500;
}
.btn-primary { background: #8b6b4a; color: #fff; }
.btn-primary:hover { background: #7a5d3f; }
.btn-primary:disabled { background: #c4b8a8; cursor: not-allowed; }
.btn-secondary { background: #e8ddd0; color: #5c3d2e; }
.btn-secondary:hover { background: #dccfc0; }
.btn-success { background: #5a8f6a; color: #fff; }
.btn-success:hover { background: #4d7d5c; }
.btn-sm { padding: 6px 14px; font-size: 13px; }

/* Info grid */
.info-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px;
    font-size: 13px; margin-bottom: 8px;
}
.info-grid .label { color: #8a7a6a; }
.info-grid .value { color: #3d2b1a; font-weight: 500; text-align: right; }

/* Note list */
.note-list {
    max-height: 200px; overflow-y: auto; font-size: 12px;
    font-family: "Consolas", "Courier New", monospace;
    background: #faf8f5; border-radius: 6px; padding: 10px;
    margin-top: 8px;
}
.note-list .title { color: #8a7a6a; margin-bottom: 4px; }

/* JSON preview */
.json-preview {
    font-family: "Consolas", "Courier New", monospace;
    font-size: 13px; line-height: 1.5;
    background: #2d2d2d; color: #f8f8f2; border-radius: 8px;
    padding: 16px; overflow-x: auto; white-space: pre;
    min-height: 80px; max-height: 400px; overflow-y: auto;
}

/* Import textarea */
textarea {
    width: 100%; min-height: 100px; padding: 12px;
    border: 2px solid #d4c5a9; border-radius: 8px;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 13px; resize: vertical; outline: none;
    transition: border-color 0.2s;
}
textarea:focus { border-color: #8b6b4a; }

.import-result {
    margin-top: 8px; padding: 10px 14px; border-radius: 8px;
    font-size: 13px; display: none;
}
.import-result.success { display: block; background: #e8f5e9; color: #2e7d32; }
.import-result.error { display: block; background: #fce4ec; color: #c62828; }

/* Guide */
.guide-toggle {
    background: none; border: none; font-size: 14px;
    cursor: pointer; color: #5c3d2e; font-weight: 500;
    padding: 4px 0; font-family: inherit;
}
.guide-toggle:hover { color: #8b6b4a; }
.guide-content {
    display: none; margin-top: 8px; padding: 12px 16px;
    background: #faf8f5; border-radius: 8px; font-size: 13px;
}
.guide-content.show { display: block; }
.guide-content ol { padding-left: 20px; }
.guide-content li { margin-bottom: 4px; }

/* Result section - hidden by default */
.result-section { display: none; }

/* Mobile */
@media (max-width: 600px) {
    .container { padding: 10px; }
    header h1 { font-size: 18px; }
    .card { padding: 14px; }
    .btn { width: 100%; justify-content: center; }
    .btn-row { flex-direction: column; }
    .info-grid { grid-template-columns: 1fr; }
    .info-grid .value { text-align: left; }
}

/* Toast */
.toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #3d2b1a; color: #fff; padding: 12px 24px;
    border-radius: 8px; font-size: 14px; z-index: 999;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="container">
    <header>
        <h1><span>🎵</span> MIDI 转八音盒乐谱</h1>
        <p>上传 MIDI 文件，生成《我的世界》钢琴模组可导入的乐谱数据</p>
    </header>

    <!-- Upload -->
    <div class="card">
        <div class="card-title">📂 上传 MIDI 文件</div>
        <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" accept=".mid,.midi">
            <div class="icon">🎹</div>
            <div class="text"><strong>点击选择</strong> 或拖拽 MIDI 文件到此处</div>
        </div>
        <div class="file-info" id="fileInfo"></div>
    </div>

    <!-- Result -->
    <div class="result-section" id="resultSection">
        <div class="card">
            <div class="card-title">📊 转换结果</div>
            <div class="info-grid" id="infoGrid"></div>
            <div id="noteListContainer"></div>
            <div class="btn-row">
                <button class="btn btn-primary" id="btnCopy">📋 复制 JSON</button>
                <button class="btn btn-success" id="btnDownload">💾 下载文件</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📄 乐谱 JSON 预览</div>
            <div class="json-preview" id="jsonPreview">等待转换...</div>
        </div>
    </div>

    <!-- Manual Import -->
    <div class="card">
        <div class="card-title">📝 手动导入乐谱</div>
        <textarea id="importText" placeholder="在此粘贴乐谱 JSON 数据，点击下方按钮解析..."></textarea>
        <div class="btn-row">
            <button class="btn btn-secondary" id="btnParse">📖 解析预览</button>
        </div>
        <div class="import-result" id="importResult"></div>
    </div>

    <!-- Guide -->
    <div class="card">
        <button class="guide-toggle" id="guideToggle">📖 游戏导入步骤 ▾</button>
        <div class="guide-content" id="guideContent">
            <ol>
                <li>上传 MIDI 文件或粘贴乐谱 JSON</li>
                <li>点击「复制 JSON」复制乐谱数据</li>
                <li>进入《我的世界》，手持<strong>空白乐谱</strong></li>
                <li>右键<strong>八音盒</strong>打开界面</li>
                <li>点击「<strong>导入乐谱</strong>」按钮</li>
                <li>空白乐谱变为「自定义乐谱」，点击「开始播放」试听！</li>
            </ol>
            <p style="margin-top:8px;color:#8a7a6a;font-size:12px;">
                💡 乐谱数据也支持导出分享给其他玩家（游戏内点「导出乐谱」按钮）
            </p>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ======================== 音符映射 ========================
const MIDI_TO_KEY = {
    60:14,62:15,64:16,65:17,67:18,69:19,71:20,
    72:7,74:8,76:9,77:10,79:11,81:12,83:13,
    84:0,86:1,88:2,89:3,91:4,93:5,95:6
};
const WHITE_NOTES = new Set(Object.keys(MIDI_TO_KEY).map(Number));
const NOTE_NAMES = {
    60:"C4",62:"D4",64:"E4",65:"F4",67:"G4",69:"A4",71:"B4",
    72:"C5",74:"D5",76:"E5",77:"F5",79:"G5",81:"A5",83:"B5",
    84:"C6",86:"D6",88:"E6",89:"F6",91:"G6",93:"A6",95:"B6"
};
const OUTPUT_TPB = 4;

// ======================== DOM 引用 ========================
const fileInput = document.getElementById('fileInput');
const uploadArea = document.getElementById('uploadArea');
const fileInfo = document.getElementById('fileInfo');
const resultSection = document.getElementById('resultSection');
const infoGrid = document.getElementById('infoGrid');
const noteListContainer = document.getElementById('noteListContainer');
const jsonPreview = document.getElementById('jsonPreview');
const btnCopy = document.getElementById('btnCopy');
const btnDownload = document.getElementById('btnDownload');
const importText = document.getElementById('importText');
const btnParse = document.getElementById('btnParse');
const importResult = document.getElementById('importResult');
const toast = document.getElementById('toast');
const guideToggle = document.getElementById('guideToggle');
const guideContent = document.getElementById('guideContent');

let currentResult = null;
let currentCompactJson = '';

// ======================== Toast ========================
function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
}

// ======================== Guide Toggle ========================
guideToggle.addEventListener('click', () => {
    guideContent.classList.toggle('show');
    guideToggle.textContent = guideContent.classList.contains('show')
        ? '📖 游戏导入步骤 ▴' : '📖 游戏导入步骤 ▾';
});

// ======================== File Upload ========================
fileInput.addEventListener('change', e => {
    if (e.target.files.length) handleFile(e.target.files[0]);
});

uploadArea.addEventListener('dragover', e => {
    e.preventDefault(); uploadArea.classList.add('dragover');
});
uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('dragover');
});
uploadArea.addEventListener('drop', e => {
    e.preventDefault(); uploadArea.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
    if (!file.name.match(/\.midi?$/i)) {
        showToast('请选择 .mid 或 .midi 文件');
        return;
    }
    const size = file.size < 1024 ? file.size + ' B'
        : file.size < 1048576 ? (file.size/1024).toFixed(1)+' KB'
        : (file.size/1048576).toFixed(1)+' MB';
    fileInfo.style.display = 'block';
    fileInfo.textContent = '🎵 ' + file.name + ' (' + size + ')';

    const reader = new FileReader();
    reader.onload = e => parseMidi(e.target.result, file.name);
    reader.readAsArrayBuffer(file);
}

// ======================== MIDI Parse ========================
function parseMidi(arrayBuffer, fileName) {
    try {
        const midi = MIDIParser.parse(new Uint8Array(arrayBuffer));
        convertMidi(midi, fileName);
    } catch(err) {
        showToast('MIDI 解析失败: ' + err.message);
    }
}

function convertMidi(midi, fileName) {
    // BPM
    let bpm = 120;
    for (const track of midi.tracks) {
        for (const ev of track.event) {
            if (ev.subtype === 0x51 && ev.data && ev.data.length === 3) {
                const us = (ev.data[0] << 16) | (ev.data[1] << 8) | ev.data[2];
                bpm = Math.round(60000000 / us);
                break;
            }
        }
    }
    const ticksPerBeat = midi.header.ticksPerBeat || 480;

    // Collect note events
    const ongoing = {};
    const noteEvents = {};
    let totalMsgs = 0, skippedBlack = 0, skippedRange = 0;

    for (const track of midi.tracks) {
        let absTick = 0;
        for (const ev of track.event) {
            absTick += ev.deltaTime || 0;
            totalMsgs++;
            const note = ev.data && ev.data[0];
            const vel = ev.data && ev.data[1];

            if (ev.subtype === 0x90 && vel > 0) {
                if (!WHITE_NOTES.has(note)) { skippedBlack++; continue; }
                if (note < 60 || note > 95) { skippedRange++; continue; }
                ongoing[note] = { start: absTick, vel };
            } else if (ev.subtype === 0x80 || (ev.subtype === 0x90 && vel === 0)) {
                if (ongoing[note]) {
                    const { start, vel } = ongoing[note];
                    delete ongoing[note];
                    if (!noteEvents[note]) noteEvents[note] = [];
                    noteEvents[note].push({ start, end: absTick, vel });
                }
            }
        }
    }
    // Close hanging notes
    for (const [note, info] of Object.entries(ongoing)) {
        if (!noteEvents[note]) noteEvents[note] = [];
        noteEvents[note].push({ start: info.start, end: info.start + ticksPerBeat * 2, vel: info.vel });
    }

    // Flatten
    const allNotes = [];
    for (const [note, events] of Object.entries(noteEvents)) {
        for (const ev of events) allNotes.push({ note: +note, ...ev });
    }

    if (allNotes.length === 0) {
        showToast('没有找到可转换的音符 (需要 C4~B6 的白键)');
        return;
    }

    const minTick = Math.min(...allNotes.map(n => n.start));
    const notes = allNotes.map(n => {
        const keyIdx = MIDI_TO_KEY[n.note];
        const adjStart = Math.round((n.start - minTick) * OUTPUT_TPB / ticksPerBeat);
        const dur = Math.max(1, Math.round((n.end - n.start) * OUTPUT_TPB / ticksPerBeat));
        const vol = Math.max(0.3, Math.min(1.0, n.vel / 127));
        return { keyIdx, start: adjStart, dur, vol: Math.round(vol*100)/100, noteName: NOTE_NAMES[n.note] || '?' };
    });
    notes.sort((a, b) => a.start - b.start || a.keyIdx - b.keyIdx);

    const maxEnd = Math.max(...notes.map(n => n.start + n.dur));
    const durationSec = maxEnd * 60 / bpm / OUTPUT_TPB;
    const songName = fileName.replace(/\.midi?$/i, '');
    const t = notes.map(n => [n.keyIdx, n.start, n.dur, n.vol]);

    currentResult = { v: 1, n: songName, b: bpm, t };
    currentCompactJson = JSON.stringify(currentResult);

    // Display
    displayResult({
        songName, bpm, noteCount: notes.length,
        durationSec, skippedBlack, skippedRange,
        ticksPerBeat, notes, compactJson: currentCompactJson
    });
}

// ======================== Display ========================
function displayResult(data) {
    resultSection.style.display = 'block';

    // Info
    infoGrid.innerHTML = `
        <span class="label">曲名</span><span class="value">${data.songName}</span>
        <span class="label">BPM</span><span class="value">${data.bpm}</span>
        <span class="label">有效音符</span><span class="value">${data.noteCount} 个</span>
        <span class="label">总时长</span><span class="value">约 ${data.durationSec.toFixed(1)} 秒</span>
        <span class="label">跳过黑键</span><span class="value">${data.skippedBlack} 个</span>
        <span class="label">跳过范围外</span><span class="value">${data.skippedRange} 个</span>
    `;

    // Note list
    const count = Math.min(20, data.notes.length);
    let html = '<div class="note-list"><div class="title">前 ' + count + ' 个音符:</div>';
    for (let i = 0; i < count; i++) {
        const n = data.notes[i];
        html += `${n.noteName}(idx=${n.keyIdx}) @tick=${n.start} dur=${n.dur} vol=${n.vol.toFixed(1)}\n`;
    }
    if (data.notes.length > 20) html += `... 共 ${data.notes.length} 个`;
    html += '</div>';
    noteListContainer.innerHTML = html;

    // JSON preview
    jsonPreview.textContent = JSON.stringify(currentResult, null, 2);
    resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ======================== Copy & Download ========================
btnCopy.addEventListener('click', () => {
    if (!currentCompactJson) return;
    navigator.clipboard.writeText(currentCompactJson).then(
        () => showToast('✅ 已复制到剪贴板！进入游戏导入即可'),
        () => {
            // Fallback
            const ta = document.createElement('textarea');
            ta.value = currentCompactJson; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            document.execCommand('copy'); document.body.removeChild(ta);
            showToast('✅ 已复制到剪贴板！');
        }
    );
});

btnDownload.addEventListener('click', () => {
    if (!currentResult) return;
    const blob = new Blob([JSON.stringify(currentResult, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = currentResult.n + '_musicbox.json';
    a.click();
    URL.revokeObjectURL(a.href);
});

// ======================== Manual Import ========================
btnParse.addEventListener('click', () => {
    const text = importText.value.trim();
    if (!text) { showToast('请先粘贴乐谱 JSON 数据'); return; }
    try {
        const data = JSON.parse(text);
        if (!data.n || !data.b || !Array.isArray(data.t)) {
            throw new Error('缺少必要字段 (n, b, t)');
        }
        importResult.className = 'import-result success';
        importResult.textContent = `✅ 解析成功！曲名: ${data.n} | BPM: ${data.b} | 音符: ${data.t.length} 个`;
        importResult.style.display = 'block';

        // 填充到转换结果
        currentResult = data;
        currentCompactJson = JSON.stringify(data);
        const notes = data.t.map(t => ({
            keyIdx: t[0], start: t[1], dur: t[2], vol: t[3] || 1.0, noteName: '?'
        }));
        const maxEnd = Math.max(...notes.map(n => n.start + n.dur));
        displayResult({
            songName: data.n, bpm: data.b, noteCount: data.t.length,
            durationSec: maxEnd * 60 / data.b / OUTPUT_TPB,
            skippedBlack: 0, skippedRange: 0, ticksPerBeat: 480, notes, compactJson: currentCompactJson
        });
    } catch(e) {
        importResult.className = 'import-result error';
        importResult.textContent = '❌ 解析失败: ' + e.message;
        importResult.style.display = 'block';
    }
});
</script>
</body>
</html>
